services:
  postgres:
    image: postgres:16-alpine
    container_name: village-banking-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: village_banking
    ports:
      - "5432:5432"
    volumes:
      - village_banking_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d village_banking"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  village_banking_postgres_data:
