<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visionaries Village Banking</title>
    <style>
      :root {
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #172033;
        background: #f6f8fb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #0D3B2E;
      }

      .boot-shell {
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 82% 10%, rgba(217, 162, 39, 0.24), transparent 22%),
          linear-gradient(145deg, #0D3B2E 0%, #0D3B2E 52%, #127A5A 100%);
        color: white;
      }

      .boot-phone {
        width: min(100%, 390px);
        min-height: min(760px, calc(100svh - 48px));
        border-radius: 40px;
        border: 1px solid rgba(247, 244, 238, 0.18);
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.13), rgba(255, 255, 255, 0.04)),
          rgba(0, 0, 0, 0.08);
        box-shadow: 0 28px 90px rgba(16, 42, 67, 0.36);
        display: grid;
        align-content: center;
        justify-items: center;
        gap: 28px;
        padding: 36px 28px;
        text-align: center;
        overflow: hidden;
        position: relative;
      }

      .boot-phone::before {
        content: "";
        position: absolute;
        inset: 18px;
        border-radius: 28px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        pointer-events: none;
      }

      .boot-mark {
        width: 118px;
        height: 118px;
        border-radius: 999px;
        background:
          radial-gradient(circle at 50% 42%, rgba(217, 162, 39, 0.3), transparent 38%),
          rgba(247, 244, 238, 0.16);
        color: #D9A227;
        display: grid;
        place-items: center;
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.18),
          0 18px 48px rgba(16, 42, 67, 0.24);
        font-size: 46px;
        font-weight: 900;
        position: relative;
      }

      .boot-mark::before {
        content: "";
        position: absolute;
        inset: 14%;
        border: 3px solid rgba(217, 162, 39, 0.88);
        border-top-color: rgba(255, 255, 255, 0.35);
        border-radius: 999px;
      }

      .boot-mark span {
        position: relative;
        z-index: 1;
        color: white;
      }

      .boot-copy {
        display: grid;
        gap: 10px;
      }

      .boot-copy h1 {
        margin: 0;
        font-size: clamp(32px, 8vw, 44px);
        line-height: 1.02;
        letter-spacing: 0;
      }

      .boot-copy p {
        margin: 0;
        color: #d9f99d;
        max-width: 300px;
        font-size: 17px;
        font-weight: 900;
        line-height: 1.35;
      }

      .boot-bar {
        display: block;
        width: min(180px, 54vw);
        height: 5px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.32);
      }

      .boot-bar::before {
        content: "";
        display: block;
        width: 44%;
        height: 100%;
        border-radius: inherit;
        background: #D9A227;
        animation: boot-progress 1.2s ease-in-out infinite;
      }

      @keyframes boot-progress {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(240%); }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-bar::before {
          animation: none;
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="boot-shell" aria-label="Visionaries Village Banking loading">
        <section class="boot-phone">
          <div class="boot-mark" aria-hidden="true"><span>V</span></div>
          <div class="boot-copy">
            <h1>Visionaries Village Banking</h1>
            <p>Stronger Together. Saving Today, Building Tomorrow.</p>
          </div>
          <span class="boot-bar" aria-hidden="true"></span>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
