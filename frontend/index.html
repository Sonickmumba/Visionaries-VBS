<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visionaries Village Banking</title>
    <style>
      :root {
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #172033;
        background: #f6f8fb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #f6f8fb;
      }

      .boot-shell {
        min-height: 100vh;
        display: grid;
        grid-template-columns: minmax(280px, 0.9fr) minmax(320px, 1.1fr);
      }

      .boot-brand {
        background: #102a43;
        color: white;
        padding: clamp(32px, 8vw, 84px);
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .boot-brand h1 {
        margin: 0 0 20px;
        font-size: clamp(34px, 5vw, 58px);
      }

      .boot-brand p {
        color: #dbeafe;
        font-size: 18px;
        line-height: 1.5;
        max-width: 520px;
      }

      .boot-card {
        align-self: center;
        justify-self: center;
        width: min(440px, calc(100vw - 32px));
        background: white;
        border: 1px solid #d8e1eb;
        padding: 32px;
      }

      .boot-card h2 {
        margin: 0 0 8px;
      }

      .boot-card p {
        margin: 0;
        color: #65758b;
        line-height: 1.5;
      }

      .boot-bar {
        display: block;
        height: 12px;
        margin-top: 24px;
        overflow: hidden;
        background: #e5edf5;
      }

      .boot-bar::before {
        content: "";
        display: block;
        width: 42%;
        height: 100%;
        background: #166534;
        animation: boot-progress 1.2s ease-in-out infinite;
      }

      @keyframes boot-progress {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(240%); }
      }

      @media (max-width: 767px) {
        .boot-shell {
          grid-template-columns: 1fr;
        }

        .boot-brand {
          min-height: 32vh;
          padding: 28px 20px;
        }

        .boot-brand h1 {
          font-size: 34px;
        }

        .boot-brand p {
          font-size: 16px;
        }

        .boot-card {
          align-self: start;
          margin: 24px 0;
          padding: 24px;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="boot-shell" aria-label="Visionaries Village Banking loading">
        <section class="boot-brand">
          <h1>Visionaries Village Banking</h1>
          <p>Cycle-based savings, lending, declarations, penalties, common interest, and monthly closing.</p>
        </section>
        <section class="boot-card">
          <h2>Loading</h2>
          <p>Preparing the Visionaries financial operations workspace.</p>
          <span class="boot-bar" aria-hidden="true"></span>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
